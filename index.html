<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobo Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* RESET BODY */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            position: relative;
            letter-spacing: -0.05em;
        }
        
        body.dark-mode {
            background-color: #000000;
            color: #FFFFFF;
        }
        
        /* CONTAINER PRINCIPALE - Compatibilità WebKit vecchio */
        #app-container {
            /* Dimensioni FISSE invertite */
            width: 805px;
            height: 724px;
            
            /* Posizionamento centrato */
            position: fixed;
            top: 50%;
            left: 50%;
            
            /* ROTAZIONE INVERSA CON VENDOR PREFIXES (Fondamentale per WebKit vecchio) */
            -webkit-transform-origin: center center;
            -moz-transform-origin: center center;
            transform-origin: center center;
            
            -webkit-transform: translate(-50%, -50%) rotate(-90deg);
            -moz-transform: translate(-50%, -50%) rotate(-90deg);
            transform: translate(-50%, -50%) rotate(-90deg);
            
            /* Stile */
            background-color: #000000;
            color: #FFFFFF;
            z-index: 100;
            overflow: hidden; /* Per contenere i float */
            border: 2px solid #FFFFFF;
        }
        
        /* Indicatore versione */
        .version-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            font-weight: 400;
            color: #FFFFFF;
            opacity: 0.6;
            z-index: 101;
        }
        
        /* Colonne con FLOAT (compatibilità browser vecchio) */
        .col-left {
            width: 42%;
            float: left;
            height: 100%;
            border-right: 2px solid #FFFFFF;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .col-right {
            width: 58%;
            float: left;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
        }
        
        /* Orologio */
        .clock-time {
            font-size: 110px;
            font-weight: 700;
            line-height: 1.0;
            margin-bottom: 10px;
            overflow: visible;
        }
        
        .clock-date {
            font-size: 20px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
        }
        
        /* Meteo */
        .weather-section {
            font-size: 16px;
        }
        
        .weather-temp {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .weather-desc {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 4px;
        }
        
        .weather-wind,
        .weather-rain {
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 2px;
        }
        
        /* Widget con FLOAT (compatibilità browser vecchio) */
        .widget {
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #FFFFFF;
        }
        
        .widget-full {
            width: 100%;
            height: 50%;
            float: left;
            border-bottom: 2px solid #FFFFFF;
        }
        
        .widget-half {
            width: 50%;
            height: 50%;
            float: left;
            border-right: 2px solid #FFFFFF;
            text-align: center;
            padding-top: 15px;
        }
        
        .widget-half:last-child {
            border-right: none;
        }
        
        .widget-title {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 15px;
        }
        
        .widget-content {
            height: 100%;
            padding-top: 10px;
        }
        
        /* Widget Aria */
        .air-value {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .air-judgment {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 15px;
        }
        
        .air-sparkline {
            width: 100%;
            max-width: 100%;
            height: 40px;
        }
        
        /* Widget Sole */
        .sun-times {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sun-time-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sun-icon {
            width: 24px;
            height: 24px;
        }
        
        .sun-time-text {
            font-size: 18px;
            font-weight: 400;
        }
        
        /* Widget Luna */
        .moon-phase {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .moon-icon {
            width: 50px;
            height: 50px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .moon-phase-name {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Indicatore versione -->
        <div class="version-indicator">v4-FLOAT-fix</div>
        
        <!-- Colonna Sinistra -->
        <div class="col-left">
            <div class="clock-time" id="clock-time">00:00</div>
            <div class="clock-date" id="clock-date">Lunedì 1 Gennaio</div>
            
            <div class="weather-section">
                <div class="weather-temp" id="weather-temp">--°C</div>
                <div class="weather-desc" id="weather-desc">Caricamento...</div>
                <div class="weather-wind" id="weather-wind"></div>
                <div class="weather-rain" id="weather-rain"></div>
            </div>
        </div>
        
        <!-- Colonna Destra - Widget -->
        <div class="col-right">
            <!-- Widget Aria -->
            <div class="widget widget-full widget-air">
                <div class="widget-title">Aria</div>
                <div class="widget-content">
                    <div class="air-value" id="air-value">--</div>
                    <div class="air-judgment" id="air-judgment">Caricamento...</div>
                    <svg class="air-sparkline" id="air-sparkline" viewBox="0 0 300 40" preserveAspectRatio="none">
                        <polyline id="air-line" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                    </svg>
                </div>
            </div>
            
            <!-- Widget Sole -->
            <div class="widget widget-half widget-sun">
                <div class="widget-title">Sole</div>
                <div class="widget-content">
                    <div class="sun-times">
                        <div class="sun-time-item">
                            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"/>
                                <line x1="12" y1="1" x2="12" y2="3"/>
                                <line x1="12" y1="21" x2="12" y2="23"/>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                <line x1="1" y1="12" x2="3" y2="12"/>
                                <line x1="21" y1="12" x2="23" y2="12"/>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                            <span class="sun-time-text" id="sunrise-time">--:--</span>
                        </div>
                        <div class="sun-time-item">
                            <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="12" r="5"/>
                            </svg>
                            <span class="sun-time-text" id="sunset-time">--:--</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Widget Luna -->
            <div class="widget widget-half widget-moon">
                <div class="widget-title">Luna</div>
                <div class="widget-content">
                    <div class="moon-phase">
                        <svg class="moon-icon" id="moon-icon" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="currentColor"/>
                        </svg>
                        <div class="moon-phase-name" id="moon-phase-name">Caricamento...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // COMPATIBILITÀ ES5 - Solo var e function
        // ============================================
        
        var OPENMETEO_URL = "https://api.open-meteo.com/v1/forecast?latitude=45.4064&longitude=11.8768&current_weather=true&daily=temperature_2m_max,weathercode,windspeed_10m_max,precipitation_probability_max,sunrise,sunset&hourly=pm2_5&timezone=Europe%2FRome&forecast_days=1";
        
        // ============================================
        // FUNZIONE OROLOGIO
        // ============================================
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            
            var hoursStr = hours < 10 ? "0" + hours : hours.toString();
            var minutesStr = minutes < 10 ? "0" + minutes : minutes.toString();
            
            document.getElementById("clock-time").textContent = hoursStr + ":" + minutesStr;
            
            var days = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
            var months = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", 
                         "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            
            var dayName = days[now.getDay()];
            var day = now.getDate();
            var month = months[now.getMonth()];
            
            document.getElementById("clock-date").textContent = dayName + " " + day + " " + month;
        }
        
        updateClock();
        setInterval(updateClock, 60000);
        
        // ============================================
        // FUNZIONE METEO
        // ============================================
        function getWeatherDescription(code) {
            switch(code) {
                case 0: return "Sereno";
                case 1:
                case 2:
                case 3: return "Parzialmente nuvoloso";
                case 45:
                case 48: return "Nebbia";
                case 51:
                case 53:
                case 55: return "Pioggerella";
                case 56:
                case 57: return "Pioggerella gelata";
                case 61:
                case 63:
                case 65: return "Pioggia";
                case 66:
                case 67: return "Pioggia gelata";
                case 71:
                case 73:
                case 75: return "Neve";
                case 77: return "Granelli di neve";
                case 80:
                case 81:
                case 82: return "Rovesci";
                case 85:
                case 86: return "Rovesci di neve";
                case 95: return "Temporale";
                case 96:
                case 99: return "Temporale con grandine";
                default: return "Condizioni sconosciute";
            }
        }
        
        function loadWeatherData() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", OPENMETEO_URL, true);
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        updateWeather(data);
                        updateAirQuality(data);
                        updateSunTimes(data);
                        checkDarkMode(data);
                    } catch(e) {
                        console.error("Errore parsing dati");
                    }
                }
            };
            
            xhr.onerror = function() {
                console.error("Errore di rete");
            };
            
            xhr.send();
        }
        
        function updateWeather(data) {
            if (data.current_weather && data.current_weather.temperature !== undefined) {
                var temp = Math.round(data.current_weather.temperature);
                document.getElementById("weather-temp").textContent = temp + "°C";
            }
            
            if (data.current_weather && data.current_weather.weathercode !== undefined) {
                var desc = getWeatherDescription(data.current_weather.weathercode);
                document.getElementById("weather-desc").textContent = desc;
            }
            
            if (data.current_weather && data.current_weather.windspeed !== undefined) {
                var windSpeed = Math.round(data.current_weather.windspeed);
                document.getElementById("weather-wind").textContent = "Vento: " + windSpeed + " km/h";
            }
            
            if (data.daily && data.daily.precipitation_probability_max && data.daily.precipitation_probability_max.length > 0) {
                var rainProb = data.daily.precipitation_probability_max[0];
                if (rainProb !== null && rainProb !== undefined) {
                    document.getElementById("weather-rain").textContent = "Pioggia: " + Math.round(rainProb) + "%";
                }
            }
        }
        
        // ============================================
        // WIDGET ARIA
        // ============================================
        function updateAirQuality(data) {
            if (data.hourly && data.hourly.pm2_5 && data.hourly.pm2_5.length > 0) {
                var currentPM25 = Math.round(data.hourly.pm2_5[data.hourly.pm2_5.length - 1]);
                document.getElementById("air-value").textContent = currentPM25;
                
                var judgment = "";
                if (currentPM25 <= 12) {
                    judgment = "Aria Buona";
                } else if (currentPM25 <= 35) {
                    judgment = "Aria Moderata";
                } else if (currentPM25 <= 55) {
                    judgment = "Aria Insalubre";
                } else {
                    judgment = "Aria Pericolosa";
                }
                document.getElementById("air-judgment").textContent = judgment;
                
                // Sparkline - ultime 24 ore
                if (data.hourly.pm2_5 && data.hourly.pm2_5.length >= 24) {
                    var last24 = data.hourly.pm2_5.slice(-24);
                    var maxVal = Math.max.apply(null, last24);
                    var minVal = Math.min.apply(null, last24);
                    var range = maxVal - minVal || 1;
                    
                    var points = [];
                    for (var i = 0; i < last24.length; i++) {
                        var x = (i / (last24.length - 1)) * 300;
                        var y = 40 - ((last24[i] - minVal) / range) * 35;
                        points.push(x + "," + y);
                    }
                    
                    document.getElementById("air-line").setAttribute("points", points.join(" "));
                }
            }
        }
        
        // ============================================
        // WIDGET SOLE
        // ============================================
        function updateSunTimes(data) {
            if (data.daily && data.daily.sunrise && data.daily.sunrise.length > 0) {
                var sunrise = new Date(data.daily.sunrise[0]);
                var hours = sunrise.getHours();
                var minutes = sunrise.getMinutes();
                var sunriseStr = (hours < 10 ? "0" : "") + hours + ":" + (minutes < 10 ? "0" : "") + minutes;
                document.getElementById("sunrise-time").textContent = sunriseStr;
            }
            
            if (data.daily && data.daily.sunset && data.daily.sunset.length > 0) {
                var sunset = new Date(data.daily.sunset[0]);
                var hours = sunset.getHours();
                var minutes = sunset.getMinutes();
                var sunsetStr = (hours < 10 ? "0" : "") + hours + ":" + (minutes < 10 ? "0" : "") + minutes;
                document.getElementById("sunset-time").textContent = sunsetStr;
            }
        }
        
        // ============================================
        // WIDGET LUNA
        // ============================================
        function calculateMoonPhase(date) {
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var day = date.getDate();
            
            if (month < 3) {
                year--;
                month += 12;
            }
            
            var a = Math.floor(year / 100);
            var b = Math.floor(a / 4);
            var c = 2 - a + b;
            var e = Math.floor(365.25 * (year + 4716));
            var f = Math.floor(30.6001 * (month + 1));
            var jd = c + day + e + f - 1524.5;
            var daysSinceNew = (jd - 2451549.5) % 29.53058867;
            
            var phase = daysSinceNew / 29.53058867;
            
            if (phase < 0.0625) return { name: "Nuova", illumination: 0 };
            if (phase < 0.1875) return { name: "Crescente", illumination: phase * 4 };
            if (phase < 0.3125) return { name: "Primo Quarto", illumination: 0.5 };
            if (phase < 0.4375) return { name: "Gibbosa Crescente", illumination: 0.5 + (phase - 0.3125) * 4 };
            if (phase < 0.5625) return { name: "Piena", illumination: 1 };
            if (phase < 0.6875) return { name: "Gibbosa Calante", illumination: 1 - (phase - 0.5625) * 4 };
            if (phase < 0.8125) return { name: "Ultimo Quarto", illumination: 0.5 };
            if (phase < 0.9375) return { name: "Calante", illumination: 0.5 - (phase - 0.8125) * 4 };
            return { name: "Nuova", illumination: 0 };
        }
        
        function updateMoonPhase() {
            var now = new Date();
            var phase = calculateMoonPhase(now);
            
            document.getElementById("moon-phase-name").textContent = phase.name;
            
            var moonSvg = document.getElementById("moon-icon");
            var illumination = phase.illumination;
            
            // Crea SVG della luna basato sulla fase
            var svgContent = "";
            if (illumination === 0) {
                // Luna nuova - cerchio nero
                svgContent = '<circle cx="50" cy="50" r="45" fill="currentColor" opacity="0.3"/>';
            } else if (illumination === 1) {
                // Luna piena - cerchio pieno
                svgContent = '<circle cx="50" cy="50" r="45" fill="currentColor"/>';
            } else if (illumination < 0.5) {
                // Luna crescente
                var clipId = "moon-clip-" + Date.now();
                svgContent = '<defs><clipPath id="' + clipId + '"><path d="M 50,5 A 45,45 0 0,1 50,95 A ' + (45 * (1 - illumination * 2)) + ',45 0 0,0 50,5 Z"/></clipPath></defs>';
                svgContent += '<circle cx="50" cy="50" r="45" fill="currentColor" clip-path="url(#' + clipId + ')"/>';
            } else {
                // Luna calante
                var clipId = "moon-clip-" + Date.now();
                svgContent = '<defs><clipPath id="' + clipId + '"><path d="M 50,5 A 45,45 0 0,0 50,95 A ' + (45 * ((illumination - 0.5) * 2)) + ',45 0 0,1 50,5 Z"/></clipPath></defs>';
                svgContent += '<circle cx="50" cy="50" r="45" fill="currentColor" clip-path="url(#' + clipId + ')"/>';
            }
            
            moonSvg.innerHTML = svgContent;
        }
        
        // ============================================
        // DARK MODE AUTOMATICA
        // ============================================
        function checkDarkMode(data) {
            if (data.daily && data.daily.sunset && data.daily.sunset.length > 0) {
                var sunset = new Date(data.daily.sunset[0]);
                var now = new Date();
                
                if (now.getTime() > sunset.getTime()) {
                    document.body.classList.add("dark-mode");
                } else {
                    document.body.classList.remove("dark-mode");
                }
            }
        }
        
        // ============================================
        // INIZIALIZZAZIONE
        // ============================================
        loadWeatherData();
        updateMoonPhase();
        
        // Refresh ogni 30 minuti
        setInterval(function() {
            location.reload();
        }, 1000 * 60 * 30);
    </script>
</body>
</html>
