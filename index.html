<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobo Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* RESET BODY */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            position: relative;
            letter-spacing: -0.05em;
        }
        
        body.dark-mode {
            background-color: #000000;
            color: #FFFFFF;
        }
        
        /* CONTAINER PRINCIPALE - Compatibilità WebKit vecchio */
        #app-container {
            width: 805px;
            height: 724px;
            position: fixed;
            top: 50%;
            left: 50%;
            -webkit-transform-origin: center center;
            -moz-transform-origin: center center;
            transform-origin: center center;
            -webkit-transform: translate(-50%, -50%) rotate(-90deg);
            -moz-transform: translate(-50%, -50%) rotate(-90deg);
            transform: translate(-50%, -50%) rotate(-90deg);
            background-color: #000000;
            color: #FFFFFF;
            z-index: 100;
            overflow: hidden;
            padding: 12px;
            box-sizing: border-box;
        }
        
        /* Indicatore versione */
        .version-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            font-weight: 400;
            color: #FFFFFF;
            opacity: 0.6;
            z-index: 101;
        }
        
        /* Top Bar - Orologio e Data Orizzontale */
        .top-bar {
            width: 100%;
            height: 70px;
            border-bottom: 2px solid #FFFFFF;
            padding: 8px 0;
            margin-bottom: 12px;
            overflow: hidden;
            text-align: center;
        }
        
        .clock-time {
            font-size: 62px;
            font-weight: 700;
            line-height: 1;
            float: left;
            margin-right: 15px;
        }
        
        .clock-date {
            font-size: 22px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            float: left;
            padding-top: 22px;
        }
        
        /* Riga Principale - Temp + Meteo Info Orizzontale */
        .main-row {
            width: 100%;
            height: 140px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .temp-section {
            width: 45%;
            height: 100%;
            float: left;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 15px;
            -moz-border-radius: 15px;
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        
        .weather-temp {
            font-size: 79px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .weather-desc {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 3px;
        }
        
        .weather-info {
            width: 53%;
            height: 100%;
            float: left;
            margin-left: 2%;
            overflow: hidden;
            text-align: center;
        }
        
        .weather-wind,
        .weather-rain {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 8px;
            padding: 10px;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 10px;
            -moz-border-radius: 10px;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* Riga Aria + Previsioni Orizzontale */
        .middle-row {
            width: 100%;
            height: 140px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .air-panel {
            width: 48%;
            height: 100%;
            float: left;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 15px;
            -moz-border-radius: 15px;
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
            text-align: center;
        }
        
        .air-header {
            width: 100%;
            margin-bottom: 8px;
            overflow: hidden;
            text-align: center;
        }
        
        .air-title {
            font-size: 18px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            display: block;
            margin-bottom: 5px;
        }
        
        .air-value {
            font-size: 46px;
            font-weight: 700;
            line-height: 1;
            display: block;
            margin-bottom: 5px;
        }
        
        .air-judgment {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .air-sparkline {
            width: 100%;
            max-width: 100%;
            height: 35px;
            overflow: hidden;
        }
        
        .forecast-section {
            width: 50%;
            height: 100%;
            float: left;
            margin-left: 2%;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 15px;
            -moz-border-radius: 15px;
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
            text-align: center;
        }
        
        .forecast-title {
            font-size: 18px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .forecast-days-list {
            width: 100%;
            overflow: hidden;
        }
        
        .forecast-day {
            width: 30%;
            float: left;
            margin-right: 3%;
            text-align: center;
        }
        
        .forecast-day:last-child {
            margin-right: 0;
        }
        
        .forecast-day-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .forecast-day-icon {
            width: 30px;
            height: 30px;
            display: inline-block;
            margin: 5px 0;
        }
        
        .forecast-day-temp {
            font-size: 18px;
            font-weight: 400;
        }
        
        /* Riga Metriche Orizzontale */
        .metrics-row {
            width: 100%;
            height: 180px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .metric-panel {
            width: 23%;
            height: 100%;
            float: left;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 15px;
            -moz-border-radius: 15px;
            border-radius: 15px;
            padding: 12px;
            margin-right: 2%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        
        .metric-panel:last-child {
            margin-right: 0;
        }
        
        .metric-title {
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 35px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1;
            text-align: center;
        }
        
        .metric-label {
            font-size: 18px;
            font-weight: 400;
            text-align: center;
        }
        
        .metric-sun-times {
            font-size: 22px;
            font-weight: 500;
            margin-top: 5px;
            text-align: center;
        }
        
        .metric-sun-label {
            font-size: 13px;
            font-weight: 400;
            margin-top: 3px;
            text-align: center;
        }
        
        /* Sun/Moon Panel Orizzontale */
        .sun-moon-panel {
            width: 100%;
            height: 100px;
            border: 2px solid #FFFFFF;
            -webkit-border-radius: 15px;
            -moz-border-radius: 15px;
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .sun-moon-content {
            width: 100%;
            overflow: hidden;
        }
        
        .sun-item, .moon-item {
            width: 48%;
            float: left;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }
        
        .sun-item {
            margin-right: 2%;
            border-right: 2px solid #FFFFFF;
        }
        
        .sun-icon, .moon-icon {
            width: 40px;
            height: 40px;
            display: inline-block;
            margin-bottom: 8px;
        }
        
        .sunrise-time, .sunset-time {
            font-size: 20px;
            font-weight: 500;
            margin: 3px 0;
            display: block;
            text-align: center;
        }
        
        .moon-phase-name {
            font-size: 18px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-align: center;
        }
        
        /* Utility */
        .clearfix:after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Indicatore versione -->
        <div class="version-indicator">v7-CENTERED</div>
        
        <!-- Top Bar -->
        <div class="top-bar clearfix">
            <div class="clock-time" id="clock-time">00:00</div>
            <div class="clock-date" id="clock-date">Lunedì 1 Gennaio</div>
        </div>
        
        <!-- Riga Principale: Temp + Info Meteo -->
        <div class="main-row clearfix">
            <div class="temp-section">
                <div class="weather-temp" id="weather-temp">--°C</div>
                <div class="weather-desc" id="weather-desc">Caricamento...</div>
            </div>
            <div class="weather-info">
                <div class="weather-wind" id="weather-wind"></div>
                <div class="weather-rain" id="weather-rain"></div>
            </div>
        </div>
        
        <!-- Riga Media: Aria + Previsioni -->
        <div class="middle-row clearfix">
            <div class="air-panel">
                <div class="air-header clearfix">
                    <div class="air-title">Qualità Aria</div>
                    <div class="air-value" id="air-value">--</div>
                </div>
                <div class="air-judgment" id="air-judgment">Caricamento...</div>
                <svg class="air-sparkline" id="air-sparkline" viewBox="0 0 300 35" preserveAspectRatio="none">
                    <polyline id="air-line" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                </svg>
            </div>
            <div class="forecast-section">
                <div class="forecast-title">Prossimi Giorni</div>
                <div class="forecast-days-list clearfix" id="forecast-days-list"></div>
            </div>
        </div>
        
        <!-- Riga Metriche: 4 Pannelli Orizzontali -->
        <div class="metrics-row clearfix">
            <!-- Vento -->
            <div class="metric-panel">
                <div class="metric-title">Vento</div>
                <div class="metric-value" id="wind-value">--</div>
                <div class="metric-label">km/h</div>
            </div>
            
            <!-- Pioggia -->
            <div class="metric-panel">
                <div class="metric-title">Pioggia</div>
                <div class="metric-value" id="rain-value">--</div>
                <div class="metric-label">%</div>
            </div>
            
            <!-- Sole -->
            <div class="metric-panel">
                <div class="metric-title">Sole</div>
                <div class="metric-sun-times" id="sunrise-value">--:--</div>
                <div class="metric-sun-label">Alba</div>
                <div class="metric-sun-times" id="sunset-value">--:--</div>
                <div class="metric-sun-label">Tramonto</div>
            </div>
            
            <!-- Luna -->
            <div class="metric-panel">
                <div class="metric-title">Luna</div>
                <svg class="moon-icon" id="moon-icon" viewBox="0 0 100 100" style="width: 60px; height: 60px; margin: 5px auto; display: block;">
                    <circle cx="50" cy="50" r="45" fill="currentColor"/>
                </svg>
                <div class="metric-label" id="moon-phase-name" style="font-size: 14px; margin-top: 5px;">Caricamento...</div>
            </div>
        </div>
        
        <!-- Sun/Moon Panel -->
        <div class="sun-moon-panel">
            <div class="sun-moon-content clearfix">
                <div class="sun-item">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
                        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <div class="sunrise-time" id="sunrise-time">--:--</div>
                    <div class="sunset-time" id="sunset-time">--:--</div>
                </div>
                <div class="moon-item">
                    <svg class="moon-icon" id="moon-icon-bottom" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="currentColor"/>
                    </svg>
                    <div class="moon-phase-name" id="moon-phase-name-bottom">Caricamento...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // COMPATIBILITÀ ES5 - Solo var e function
        // ============================================
        
        var OPENMETEO_URL = "https://api.open-meteo.com/v1/forecast?latitude=45.4064&longitude=11.8768&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode,windspeed_10m_max,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FRome&forecast_days=4";
        
        var AIR_QUALITY_URL = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=45.4064&longitude=11.8768&hourly=european_aqi&timezone=Europe%2FRome&forecast_days=1";
        
        // ============================================
        // FUNZIONE OROLOGIO
        // ============================================
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            
            var hoursStr = hours < 10 ? "0" + hours : hours.toString();
            var minutesStr = minutes < 10 ? "0" + minutes : minutes.toString();
            
            document.getElementById("clock-time").textContent = hoursStr + ":" + minutesStr;
            
            var days = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
            var months = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", 
                         "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            
            var dayName = days[now.getDay()];
            var day = now.getDate();
            var month = months[now.getMonth()];
            
            document.getElementById("clock-date").textContent = dayName + " " + day + " " + month;
        }
        
        updateClock();
        setInterval(updateClock, 60000);
        
        // ============================================
        // FUNZIONE METEO
        // ============================================
        function getWeatherDescription(code) {
            switch(code) {
                case 0: return "Sereno";
                case 1:
                case 2:
                case 3: return "Parzialmente nuvoloso";
                case 45:
                case 48: return "Nebbia";
                case 51:
                case 53:
                case 55: return "Pioggerella";
                case 56:
                case 57: return "Pioggerella gelata";
                case 61:
                case 63:
                case 65: return "Pioggia";
                case 66:
                case 67: return "Pioggia gelata";
                case 71:
                case 73:
                case 75: return "Neve";
                case 77: return "Granelli di neve";
                case 80:
                case 81:
                case 82: return "Rovesci";
                case 85:
                case 86: return "Rovesci di neve";
                case 95: return "Temporale";
                case 96:
                case 99: return "Temporale con grandine";
                default: return "Condizioni sconosciute";
            }
        }
        
        function loadWeatherData() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", OPENMETEO_URL, true);
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        updateWeather(data);
                        updateSunTimes(data);
                        updateForecastDays(data);
                        updateMetrics(data);
                        checkDarkMode(data);
                    } catch(e) {
                        console.error("Errore parsing dati meteo");
                    }
                }
            };
            
            xhr.onerror = function() {
                console.error("Errore di rete meteo");
            };
            
            xhr.send();
        }
        
        function loadAirQualityData() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", AIR_QUALITY_URL, true);
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        updateAirQuality(data);
                    } catch(e) {
                        console.error("Errore parsing dati qualità aria");
                    }
                }
            };
            
            xhr.onerror = function() {
                console.error("Errore di rete qualità aria");
            };
            
            xhr.send();
        }
        
        function updateWeather(data) {
            if (data.current_weather && data.current_weather.temperature !== undefined) {
                var temp = Math.round(data.current_weather.temperature);
                document.getElementById("weather-temp").textContent = temp + "°C";
            }
            
            if (data.current_weather && data.current_weather.weathercode !== undefined) {
                var desc = getWeatherDescription(data.current_weather.weathercode);
                document.getElementById("weather-desc").textContent = desc;
            }
            
            if (data.current_weather && data.current_weather.windspeed !== undefined) {
                var windSpeed = Math.round(data.current_weather.windspeed);
                document.getElementById("weather-wind").textContent = "Vento: " + windSpeed + " km/h";
            }
            
            if (data.daily && data.daily.precipitation_probability_max && data.daily.precipitation_probability_max.length > 0) {
                var rainProb = data.daily.precipitation_probability_max[0];
                if (rainProb !== null && rainProb !== undefined) {
                    document.getElementById("weather-rain").textContent = "Pioggia: " + Math.round(rainProb) + "%";
                }
            }
        }
        
        function updateMetrics(data) {
            // Vento
            if (data.current_weather && data.current_weather.windspeed !== undefined) {
                var windSpeed = Math.round(data.current_weather.windspeed);
                document.getElementById("wind-value").textContent = windSpeed;
            }
            
            // Pioggia
            if (data.daily && data.daily.precipitation_probability_max && data.daily.precipitation_probability_max.length > 0) {
                var rainProb = data.daily.precipitation_probability_max[0];
                if (rainProb !== null && rainProb !== undefined) {
                    document.getElementById("rain-value").textContent = Math.round(rainProb);
                }
            }
            
            // Sole (già aggiornato da updateSunTimes)
        }
        
        // ============================================
        // WIDGET ARIA
        // ============================================
        function updateAirQuality(data) {
            if (data.hourly && data.hourly.european_aqi && data.hourly.european_aqi.length > 0) {
                var currentAQI = Math.round(data.hourly.european_aqi[data.hourly.european_aqi.length - 1]);
                document.getElementById("air-value").textContent = currentAQI;
                
                var judgment = "";
                if (currentAQI <= 20) {
                    judgment = "Ottima";
                } else if (currentAQI <= 40) {
                    judgment = "Buona";
                } else if (currentAQI <= 60) {
                    judgment = "Moderata";
                } else if (currentAQI <= 80) {
                    judgment = "Scarsa";
                } else {
                    judgment = "Pessima";
                }
                document.getElementById("air-judgment").textContent = judgment;
                
                // Sparkline - ultime 24 ore
                if (data.hourly.european_aqi && data.hourly.european_aqi.length >= 24) {
                    var last24 = data.hourly.european_aqi.slice(-24);
                    var maxVal = Math.max.apply(null, last24);
                    var minVal = Math.min.apply(null, last24);
                    var range = maxVal - minVal || 1;
                    
                    var points = [];
                    for (var i = 0; i < last24.length; i++) {
                        var x = (i / (last24.length - 1)) * 300;
                        var y = 30 - ((last24[i] - minVal) / range) * 25;
                        points.push(x + "," + y);
                    }
                    
                    document.getElementById("air-line").setAttribute("points", points.join(" "));
                }
            }
        }
        
        // ============================================
        // WIDGET SOLE
        // ============================================
        function updateSunTimes(data) {
            if (data.daily && data.daily.sunrise && data.daily.sunrise.length > 0) {
                var sunrise = new Date(data.daily.sunrise[0]);
                var hours = sunrise.getHours();
                var minutes = sunrise.getMinutes();
                var sunriseStr = (hours < 10 ? "0" : "") + hours + ":" + (minutes < 10 ? "0" : "") + minutes;
                document.getElementById("sunrise-time").textContent = sunriseStr;
                document.getElementById("sunrise-value").textContent = sunriseStr;
            }
            
            if (data.daily && data.daily.sunset && data.daily.sunset.length > 0) {
                var sunset = new Date(data.daily.sunset[0]);
                var hours = sunset.getHours();
                var minutes = sunset.getMinutes();
                var sunsetStr = (hours < 10 ? "0" : "") + hours + ":" + (minutes < 10 ? "0" : "") + minutes;
                document.getElementById("sunset-time").textContent = sunsetStr;
                document.getElementById("sunset-value").textContent = sunsetStr;
            }
        }
        
        // ============================================
        // WIDGET LUNA
        // ============================================
        function calculateMoonPhase(date) {
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var day = date.getDate();
            
            if (month < 3) {
                year--;
                month += 12;
            }
            
            var a = Math.floor(year / 100);
            var b = Math.floor(a / 4);
            var c = 2 - a + b;
            var e = Math.floor(365.25 * (year + 4716));
            var f = Math.floor(30.6001 * (month + 1));
            var jd = c + day + e + f - 1524.5;
            var daysSinceNew = (jd - 2451549.5) % 29.53058867;
            
            var phase = daysSinceNew / 29.53058867;
            
            if (phase < 0.0625) return { name: "Nuova", illumination: 0 };
            if (phase < 0.1875) return { name: "Crescente", illumination: phase * 4 };
            if (phase < 0.3125) return { name: "Primo Quarto", illumination: 0.5 };
            if (phase < 0.4375) return { name: "Gibbosa Crescente", illumination: 0.5 + (phase - 0.3125) * 4 };
            if (phase < 0.5625) return { name: "Piena", illumination: 1 };
            if (phase < 0.6875) return { name: "Gibbosa Calante", illumination: 1 - (phase - 0.5625) * 4 };
            if (phase < 0.8125) return { name: "Ultimo Quarto", illumination: 0.5 };
            if (phase < 0.9375) return { name: "Calante", illumination: 0.5 - (phase - 0.8125) * 4 };
            return { name: "Nuova", illumination: 0 };
        }
        
        function updateMoonPhase() {
            var now = new Date();
            var phase = calculateMoonPhase(now);
            
            document.getElementById("moon-phase-name").textContent = phase.name;
            document.getElementById("moon-phase-name-bottom").textContent = phase.name;
            
            var moonSvg = document.getElementById("moon-icon");
            var moonSvgBottom = document.getElementById("moon-icon-bottom");
            var illumination = phase.illumination;
            
            // Crea SVG della luna basato sulla fase
            var svgContent = "";
            if (illumination === 0) {
                svgContent = '<circle cx="50" cy="50" r="45" fill="currentColor" opacity="0.3"/>';
            } else if (illumination === 1) {
                svgContent = '<circle cx="50" cy="50" r="45" fill="currentColor"/>';
            } else if (illumination < 0.5) {
                var clipId = "moon-clip-" + Date.now();
                svgContent = '<defs><clipPath id="' + clipId + '"><path d="M 50,5 A 45,45 0 0,1 50,95 A ' + (45 * (1 - illumination * 2)) + ',45 0 0,0 50,5 Z"/></clipPath></defs>';
                svgContent += '<circle cx="50" cy="50" r="45" fill="currentColor" clip-path="url(#' + clipId + ')"/>';
            } else {
                var clipId = "moon-clip-" + Date.now();
                svgContent = '<defs><clipPath id="' + clipId + '"><path d="M 50,5 A 45,45 0 0,0 50,95 A ' + (45 * ((illumination - 0.5) * 2)) + ',45 0 0,1 50,5 Z"/></clipPath></defs>';
                svgContent += '<circle cx="50" cy="50" r="45" fill="currentColor" clip-path="url(#' + clipId + ')"/>';
            }
            
            moonSvg.innerHTML = svgContent;
            moonSvgBottom.innerHTML = svgContent;
        }
        
        // ============================================
        // DARK MODE AUTOMATICA
        // ============================================
        function checkDarkMode(data) {
            if (data.daily && data.daily.sunrise && data.daily.sunrise.length > 0 && 
                data.daily.sunset && data.daily.sunset.length > 0) {
                var sunriseStr = data.daily.sunrise[0];
                var sunsetStr = data.daily.sunset[0];
                
                var sunrise = new Date(sunriseStr);
                var sunset = new Date(sunsetStr);
                var now = new Date();
                
                var debugText = "S:" + formatTimeDebug(sunrise) + " T:" + formatTimeDebug(sunset) + " NOW:" + formatTimeDebug(now);
                console.log(debugText);
                
                var isDark = (now.getTime() < sunrise.getTime() || now.getTime() > sunset.getTime());
                
                if (isDark) {
                    document.body.classList.add("dark-mode");
                } else {
                    document.body.classList.remove("dark-mode");
                }
            }
        }
        
        function formatTimeDebug(date) {
            var hours = date.getHours();
            var minutes = date.getMinutes();
            return (hours < 10 ? "0" : "") + hours + ":" + (minutes < 10 ? "0" : "") + minutes;
        }
        
        // ============================================
        // PREVISIONI PROSSIMI GIORNI
        // ============================================
        function getWeatherIconSVG(code) {
            switch(code) {
                case 0: // Sereno
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/></svg>';
                case 1:
                case 2:
                case 3: // Parzialmente nuvoloso
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5" opacity="0.5"/><path d="M 18 10 A 4 4 0 0 1 18 18 H 6 A 4 4 0 0 1 6 10 A 4 4 0 0 1 10 6 A 4 4 0 0 1 14 8 A 4 4 0 0 1 18 10 Z"/></svg>';
                case 45:
                case 48: // Nebbia
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="10" rx="4" ry="2" opacity="0.5"/><ellipse cx="12" cy="12" rx="4" ry="2" opacity="0.5"/><ellipse cx="18" cy="14" rx="4" ry="2" opacity="0.5"/></svg>';
                case 51:
                case 53:
                case 55:
                case 61:
                case 63:
                case 65:
                case 80:
                case 81:
                case 82: // Pioggia
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M 18 10 A 4 4 0 0 1 18 18 H 6 A 4 4 0 0 1 6 10 A 4 4 0 0 1 10 6 A 4 4 0 0 1 14 8 A 4 4 0 0 1 18 10 Z"/><line x1="10" y1="18" x2="10" y2="22" stroke="currentColor" stroke-width="2"/><line x1="14" y1="18" x2="14" y2="22" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2"/></svg>';
                case 71:
                case 73:
                case 75:
                case 77:
                case 85:
                case 86: // Neve
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M 18 10 A 4 4 0 0 1 18 18 H 6 A 4 4 0 0 1 6 10 A 4 4 0 0 1 10 6 A 4 4 0 0 1 14 8 A 4 4 0 0 1 18 10 Z"/><path d="M 12 18 L 10 20 M 12 18 L 14 20 M 12 18 L 12 22" stroke="currentColor" stroke-width="1.5"/></svg>';
                case 95:
                case 96:
                case 99: // Temporale
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M 18 10 A 4 4 0 0 1 18 18 H 6 A 4 4 0 0 1 6 10 A 4 4 0 0 1 10 6 A 4 4 0 0 1 14 8 A 4 4 0 0 1 18 10 Z"/><path d="M 10 16 L 14 16 L 12 20 Z" fill="currentColor"/></svg>';
                default: // Default nuvola
                    return '<svg class="forecast-day-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M 18 10 A 4 4 0 0 1 18 18 H 6 A 4 4 0 0 1 6 10 A 4 4 0 0 1 10 6 A 4 4 0 0 1 14 8 A 4 4 0 0 1 18 10 Z"/></svg>';
            }
        }
        
        function updateForecastDays(data) {
            if (data.daily && data.daily.time && data.daily.time.length > 1) {
                var daysShort = ["DOM", "LUN", "MAR", "MER", "GIO", "VEN", "SAB"];
                var html = "";
                
                // Mostra Oggi+1, Oggi+2, Oggi+3 (indici 1, 2, 3)
                for (var i = 1; i <= 3 && i < data.daily.time.length; i++) {
                    var dateStr = data.daily.time[i];
                    var date = new Date(dateStr);
                    var dayName = daysShort[date.getDay()];
                    
                    var weathercode = data.daily.weathercode[i];
                    var tempMin = data.daily.temperature_2m_min[i];
                    var tempMax = data.daily.temperature_2m_max[i];
                    
                    var iconSVG = getWeatherIconSVG(weathercode);
                    var tempStr = Math.round(tempMin) + "° / " + Math.round(tempMax) + "°";
                    
                    html += '<div class="forecast-day">';
                    html += '<div class="forecast-day-name">' + dayName + '</div>';
                    html += iconSVG;
                    html += '<div class="forecast-day-temp">' + tempStr + '</div>';
                    html += '</div>';
                }
                
                document.getElementById("forecast-days-list").innerHTML = html;
            }
        }
        
        // ============================================
        // INIZIALIZZAZIONE
        // ============================================
        loadWeatherData();
        loadAirQualityData();
        updateMoonPhase();
        
        // Refresh ogni 30 minuti
        setInterval(function() {
            location.reload();
        }, 1000 * 60 * 30);
    </script>
</body>
